<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR - Zettapapers</title>

  <!-- Same theme resources as index -->
  <link rel="stylesheet" href="styles.css?v=20260227c">
  <link rel="icon" type="image/png" href="fcn.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: #0f0f17;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: rgba(20,20,35,0.95);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      text-decoration: none;
      color: white;
      font-size: 22px;
      font-weight: 700;
    }

    .qr-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .qr-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      max-width: 400px;
      width: 100%;
    }

    .qr-card h1 {
      margin-bottom: 15px;
      font-size: 26px;
    }

    .qr-card p {
      margin-bottom: 25px;
      font-size: 14px;
      opacity: 0.8;
    }

    .qr-card img {
      width: 100%;
      max-width: 250px;
      border-radius: 15px;
      padding: 15px;
      background: white;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      background: rgba(20,20,35,0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <a href="index.html" class="logo">Zettapapers</a>
  </div>

  <!-- QR Section -->
  <section class="qr-section">
    <div class="qr-card">
      <h1>Scan to Visit</h1>
      <p>Scan this QR code to access Zettapapers instantly on your device.</p>
      <img src="frame.png" alt="Zettapapers QR Code">
    </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 Zettapapers | Designed by Daksh Jawale
  </footer>

</body>
</html>
